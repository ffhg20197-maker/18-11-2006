name: Quality Gate

on:
  push:
    branches:
      - 'feature/**'
    paths:
      - 'src/**'
      - 'package*.json'
      - 'app.js'
      - 'scripts/**'
      - 'tests/**'
      - 'index.html'
      - 'styles.css'
      - '.github/workflows/quality-gate.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package*.json'
      - 'app.js'
      - 'scripts/**'
      - 'tests/**'
      - 'index.html'
      - 'styles.css'
      - '.github/workflows/quality-gate.yml'

permissions:
  contents: read

jobs:
  quality-check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 20 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Clean dependency installation
        run: npm ci

      - name: Static analysis
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: quality-gate-dist
          path: dist/
          retention-days: 5
